{% extends "accounts/_auth.html" %}
{% load ui %}
{% block title %}링크가 만료됐어요 · Pi-Vend{% endblock %}
{% block card %}
<div class="auth-icon is-error">{% icon "circle-alert" %}</div>
<h2>링크가 만료됐거나 올바르지 않아요</h2>
<p class="sub">이미 사용한 링크이거나 24시간이 지났어요. 인증 메일을 다시 받아 주세요. 이미 인증했다면 바로 로그인할 수 있어요.</p>
<form method="post" action="{% url 'resend_verification' %}">
  {% csrf_token %}
  <div class="field"><label for="id_email">이메일</label><input class="input" id="id_email" type="email" name="email" required></div>
  <button class="btn btn-primary btn-lg btn-block" type="submit">인증 메일 다시 보내기</button>
</form>
<p class="auth-switch"><a href="{% url 'login' %}">로그인</a></p>
{% endblock %}
