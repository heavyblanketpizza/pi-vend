{% extends "accounts/_auth.html" %}
{% load ui %}
{% block title %}메일을 확인하세요 · Pi-Vend{% endblock %}
{% block card %}
<div class="auth-icon">{% icon "mail" %}</div>
<h2>메일을 보냈어요</h2>
<p class="sub">가입된 주소라면 몇 분 안에 재설정 링크가 도착해요. 메일이 없으면 스팸함을 확인하거나 주소를 다시 확인해 주세요.</p>
<p class="auth-switch"><a href="{% url 'login' %}">로그인으로 돌아가기</a></p>
{% endblock %}
